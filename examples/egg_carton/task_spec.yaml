name: egg_carton_to_tray
subtasks:
  - name: open_carton
    prompt: "Open the egg carton."
  - name: place_eggs
    prompt: "Take out the eggs one by one and place them in the egg tray."
objects:
  - name: egg_carton
    subtask: open_carton
    event: release
    arm: left
    yaw_symmetry_deg: 180.0
  - name: egg
    subtask: place_eggs
    event: grasp
    arm: left
    yaw_symmetry_deg: 360.0
  - name: egg_tray
    subtask: place_eggs
    event: release
    arm: left
    yaw_symmetry_deg: 180.0
fine_window_s: 1.0
coverage:
  xy_bin_m: 0.05
  yaw_bin_deg: 30.0
  sparse_threshold: 3
